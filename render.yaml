# Render Blueprint — 이 저장소를 Render에 "Blueprint"로 연결하면 웹 서비스 +
# Postgres DB가 이 파일 하나로 같이 생성된다 (대시보드에서 값 하나씩 입력할 필요 없음).
# 무료 티어 기준(RAM ~512MB) 설정 — torch/whisper/mediapipe가 무겁기 때문에
# workers는 1로 고정, 영상/음성 분석은 오래 걸릴 수 있어 timeout도 넉넉히 잡음.
services:
  - type: web
    name: reborn-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: reborn-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # 아래는 대시보드에서 직접 값을 채워야 함 (sync: false = 이 파일에 값을 안 적음,
      # Render Dashboard → Environment 탭에서 수동 입력)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

databases:
  - name: reborn-db
    plan: free
    databaseName: reborn_db
    user: reborn
