name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-lint:
    # torch/whisper 등 무거운 의존성 설치 없이, 전체 .py 파일 문법만 빠르게 확인.
    # 실제 임포트는 안 해서 무거운 라이브러리가 없어도 됨 (DB_DESIGN.md, ACCURACY_NOTES.md 참고).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check syntax (ast.parse, no imports needed)
        run: |
          python -c "
          import ast, pathlib, sys
          failed = False
          for path in pathlib.Path('.').rglob('*.py'):
              if '.venv' in path.parts or 'venv' in path.parts:
                  continue
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except SyntaxError as e:
                  print(f'::error file={path}::{e}')
                  failed = True
          sys.exit(1 if failed else 0)
          "
      - run: pip install ruff
      - run: ruff check . --select=F  # 정의되지 않은 이름 등 확실한 오류만 (스타일 규칙 X)

  test-pure-logic:
    # 순수 로직(step1/2/3의 임계값 비교·집계·프롬프트 조립)만 테스트 — torch/whisper/
    # mediapipe 불필요. numpy + opencv-headless만 있으면 됨(gaze_analyzer가 cv2를 모듈
    # 최상단에서 import하지만 테스트 대상 함수 자체는 순수 수학이라 opencv-headless로 충분).
    # app.py(torch/whisper 로드)는 여전히 CI 대상 아님 — 이유는 DB_DESIGN.md / 이전 대화
    # 참고 (실제 학습 모델 파일이 레포에 없어 의미있게 테스트 불가, whisper는 모델을
    # 런타임에 다운로드해야 해서 매 push마다 느려짐). API 통합 테스트 구조는
    # docs/TESTING.md 참고.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # cache: pip 안 씀 — requirements.txt/pyproject.toml이 레포에 없어서
          # 캐시 키를 못 잡고 setup-python 자체가 에러로 죽음 (실제로 한 번 겪음)
      # opencv-python-headless<5 로 고정 — 5.0.0부터 CascadeClassifier가 headless
      # 패키지 단독으로는 안 딸려와서(opencv-contrib-python이 있어야 함) 2026-09-18
      # CI에서 test_smile_cascade.py가 AttributeError로 깨짐. smile_cascade.py는
      # 이미 폐기·기록용 보존 모듈이라 새 의존성(contrib) 추가보다 버전 고정이 맞음.
      - run: pip install numpy "opencv-python-headless<5" pytest
      - run: >
          pytest tests/test_scoring.py tests/test_blink_analyzer.py
          tests/test_expression_analyzer.py tests/test_gaze_analyzer.py
          tests/test_interview_question.py tests/test_llm_feedback.py
          tests/test_smile_cascade.py tests/test_set_baseline.py -v
