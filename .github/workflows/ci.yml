name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-lint:
    # torch/whisper 등 무거운 의존성 설치 없이, 전체 .py 파일 문법만 빠르게 확인.
    # 실제 임포트는 안 해서 무거운 라이브러리가 없어도 됨 (DB_DESIGN.md, ACCURACY_NOTES.md 참고).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check syntax (ast.parse, no imports needed)
        run: |
          python -c "
          import ast, pathlib, sys
          failed = False
          for path in pathlib.Path('.').rglob('*.py'):
              if '.venv' in path.parts or 'venv' in path.parts:
                  continue
              try:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except SyntaxError as e:
                  print(f'::error file={path}::{e}')
                  failed = True
          sys.exit(1 if failed else 0)
          "
      - run: pip install ruff
      - run: ruff check . --select=F  # 정의되지 않은 이름 등 확실한 오류만 (스타일 규칙 X)

  test-step2:
    # step2/ 순수 로직(scoring, blink, expression)만 테스트 — torch/whisper/mediapipe
    # 불필요, numpy만 있으면 됨. gaze_analyzer(cv2)·app.py(torch/whisper)는 CI 대상 아님
    # — 이유는 DB_DESIGN.md / 이전 대화 참고 (실제 학습 모델 파일이 레포에 없어 의미있게
    # 테스트 불가, whisper는 모델을 런타임에 다운로드해야 해서 매 push마다 느려짐).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # cache: pip 안 씀 — requirements.txt/pyproject.toml이 레포에 없어서
          # 캐시 키를 못 잡고 setup-python 자체가 에러로 죽음 (실제로 한 번 겪음)
      - run: pip install numpy pytest
      - run: pytest tests/test_scoring.py tests/test_blink_analyzer.py tests/test_expression_analyzer.py -v
