# main에 머지되면 Hugging Face Space(백엔드 배포)에 코드를 올린다 — Render처럼 머지하면 자동 배포되게.
# git push 대신 huggingface_hub의 upload_folder를 쓴다: HF는 바이너리 파일(models/*.pth)을 git으로 그냥 올리면
# 거부해서(LFS/Xet 필요), 파일 업로드 API가 더 간단하다.
# 저장소 설정에 필요: Settings → Secrets and variables → Actions
#   - Secret  HF_TOKEN  : Hugging Face Access Token(Write 권한)
#   - Variable HF_SPACE : "<HF 사용자이름>/<Space 이름>"  (예: reborn-hongik/reborn-backend)
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "huggingface_hub>=0.25"
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path=".",
              ignore_patterns=[".git/*", ".github/*", "tests/*", "docs/*", "**/__pycache__/*", "*.pyc", ".env", "venv/*", ".venv/*"],
              commit_message=f"GitHub main {os.environ.get('GITHUB_SHA', '')[:7]}",
          )
          PY
